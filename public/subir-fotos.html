<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Subí tus fotos — Lucia &amp; Agustín</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --marfil: #F6F1E7;
    --marfil-claro: #EFE7D7;
    --pino: #20302A;
    --pino-claro: #2A3F37;
    --dorado: #B0813F;
    --dorado-claro: #C7A063;
    --dorado-oscuro: #8B6530;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    position: relative;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--marfil);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    isolation: isolate;
  }

  /* ── Fondo animado ── */
  .bg-gradient {
    position: fixed;
    inset: 0;
    z-index: -3;
    background: linear-gradient(120deg, #172420, #172420, #20302A, #2c4438, #20302A, #172420, #172420);
    background-size: 400% 400%;
    animation: bgShift 28s linear infinite;
  }
  .bg-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 70vw;
    height: 70vw;
    max-width: 560px;
    max-height: 560px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: -2;
    background: radial-gradient(circle, rgba(124,144,114,0.14), transparent 70%);
    animation: glowPulse 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes glowPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
  }

  .particles {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    bottom: -5%;
    box-shadow: 0 0 8px rgba(176,129,63,0.35);
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translate(0, 0) scale(0.3); opacity: 0; }
    10% { opacity: 0.85; }
    90% { opacity: 0.85; }
    100% { transform: translate(var(--drift), -115vh) scale(1); opacity: 0; }
  }

  .lavender {
    position: fixed;
    width: 190px;
    max-width: 38vw;
    pointer-events: none;
    z-index: 0;
    filter: brightness(1.35);
  }
  .lavender-tl {
    top: -18px;
    left: -18px;
    opacity: 0.4;
    transform: scaleX(-1);
    transform-origin: top center;
    animation: swayA 5.5s ease-in-out infinite;
  }
  .lavender-br {
    bottom: -18px;
    right: -18px;
    opacity: 0.4;
    transform-origin: bottom center;
    animation: swayB 6.5s ease-in-out infinite 0.8s;
  }
  @keyframes swayA {
    0%, 100% { transform: scaleX(-1) rotate(-3deg) translateY(0); }
    50% { transform: scaleX(-1) rotate(2deg) translateY(-10px); }
  }
  @keyframes swayB {
    0%, 100% { transform: rotate(2deg) translateY(0); }
    50% { transform: rotate(-3deg) translateY(10px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-gradient, .bg-glow, .particle, .lavender { animation: none !important; }
  }

  /* ── Tarjeta ── */
  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 480px;
    background: rgba(246, 241, 231, 0.97);
    backdrop-filter: blur(6px);
    border-radius: 24px;
    padding: 36px 26px;
    text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,0.45), 0 0 0 1.5px rgba(176,129,63,0.25);
    animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-family: 'Great Vibes', cursive;
    color: var(--pino);
    font-size: 44px;
    margin: 0 0 4px;
    font-weight: 400;
  }
  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    font-size: 12px;
    color: var(--dorado-oscuro);
    margin: 0 0 20px;
  }
  p.desc {
    color: #4a4a44;
    font-size: 17px;
    line-height: 1.5;
    margin: 0 0 24px;
  }

  .field {
    position: relative;
    margin-bottom: 16px;
  }
  .field-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--dorado);
    opacity: 0.8;
    pointer-events: none;
  }
  input[type="text"] {
    width: 100%;
    padding: 13px 14px 13px 40px;
    border-radius: 999px;
    border: 1.5px solid rgba(176,129,63,0.35);
    background: #fff;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    color: var(--pino);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--dorado-claro);
    box-shadow: 0 0 0 4px rgba(199,160,99,0.22);
  }

  #fileInput { display: none; }

  /* ── Zona de arrastre ── */
  .drop-zone {
    border: 2px dashed rgba(176,129,63,0.5);
    border-radius: 18px;
    padding: 26px 16px;
    cursor: pointer;
    background: rgba(255,255,255,0.5);
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    margin-bottom: 16px;
  }
  .drop-zone:hover, .drop-zone:focus-visible {
    border-color: var(--dorado);
    background: rgba(176,129,63,0.08);
    outline: none;
  }
  .drop-zone.drag-over {
    border-color: var(--dorado);
    border-style: solid;
    background: rgba(176,129,63,0.14);
    transform: scale(1.015);
  }
  .drop-icon {
    color: var(--dorado);
    margin-bottom: 6px;
    animation: floatIcon 2.6s ease-in-out infinite;
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .drop-text {
    margin: 0;
    font-size: 16px;
    color: var(--pino);
    line-height: 1.4;
  }
  .drop-text span {
    display: block;
    font-size: 13px;
    color: var(--dorado-oscuro);
    margin-top: 2px;
  }

  /* ── Botones ── */
  .btn {
    display: inline-block;
    width: 100%;
    padding: 15px 20px;
    border-radius: 999px;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.03em;
    cursor: pointer;
    background: linear-gradient(135deg, var(--dorado-claro), var(--dorado));
    color: var(--marfil);
    box-shadow: 0 8px 24px rgba(176,129,63,0.45);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(176,129,63,0.55); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .btn:disabled { opacity: 0.6; cursor: default; transform: none; }
  .btn-secondary {
    background: transparent;
    color: var(--dorado-oscuro);
    box-shadow: none;
    border: 1.5px solid rgba(176,129,63,0.4);
  }
  .btn-secondary:hover:not(:disabled) { background: rgba(176,129,63,0.08); box-shadow: none; }

  .status {
    font-size: 15px;
    margin: 0 0 14px;
    min-height: 20px;
  }
  .status.error { color: #a13b2e; }
  .status.ok { color: #2f6b3f; }

  .icon {
    font-size: 42px;
    margin-bottom: 10px;
    display: inline-block;
  }
  .success-icon { animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop {
    0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(4deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .hidden { display: none !important; }

  /* ── Botones de acción (cámara / galería) ── */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 14px 8px;
    border-radius: 18px;
    border: 1.5px solid rgba(176,129,63,0.4);
    background: #fff;
    color: var(--pino);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .action-btn:hover { background: rgba(176,129,63,0.08); border-color: var(--dorado); }
  .action-btn:active { transform: scale(0.97); }
  .action-btn .emoji { font-size: 26px; line-height: 1; }
  .action-btn.primary {
    grid-column: 1 / -1;
    flex-direction: row;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--dorado-claro), var(--dorado));
    color: var(--marfil);
    border-color: transparent;
    box-shadow: 0 8px 24px rgba(176,129,63,0.4);
    font-size: 18px;
    padding: 15px 8px;
  }
  .action-btn.primary:hover { background: linear-gradient(135deg, var(--dorado-claro), var(--dorado)); }
  .file-input { display: none; }
  .hint {
    font-size: 15px;
    color: var(--dorado-oscuro);
    margin: -6px 0 14px;
    min-height: 0;
  }
  .hint.warn { color: #a13b2e; }

  /* El drop zone solo tiene sentido en compu */
  @media (hover: none) { .drop-zone { display: none; } }

  /* ── Resumen + cola ── */
  .summary {
    display: none;
    text-align: left;
    background: #fff;
    border: 1.5px solid rgba(176,129,63,0.3);
    border-radius: 16px;
    padding: 12px 14px;
    margin: 4px 0 12px;
  }
  .summary.visible { display: block; }
  .summary-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 16px;
    color: var(--pino);
    margin-bottom: 8px;
  }
  .summary-top strong { font-size: 17px; }
  .summary-top span { font-size: 14px; color: var(--dorado-oscuro); white-space: nowrap; }
  .bar {
    height: 10px;
    border-radius: 999px;
    background: rgba(176,129,63,0.15);
    overflow: hidden;
  }
  .bar > div {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--dorado-claro), var(--dorado));
    transition: width 0.25s ease;
  }
  .summary.done .bar > div { background: #5a8a5f; }
  .summary-note { font-size: 13.5px; color: #6b6b62; margin: 8px 0 0; line-height: 1.35; }

  .queue {
    list-style: none;
    margin: 0 0 8px;
    padding: 0;
    text-align: left;
    max-height: 46vh;
    overflow-y: auto;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(176,129,63,0.15);
    animation: cardIn 0.3s ease;
  }
  .item:last-child { border-bottom: none; }
  .thumb {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--dorado-claro), var(--dorado));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-size: 14.5px;
    color: var(--pino);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-status { font-size: 13px; color: var(--dorado-oscuro); margin: 1px 0 4px; }
  .item.error .item-status { color: #a13b2e; }
  .item.done .item-status { color: #2f6b3f; }
  .item .bar { height: 5px; }
  .item.done .bar > div { background: #5a8a5f; }
  .item.error .bar > div { background: #c0392b; }
  .item-btn {
    flex-shrink: 0;
    border: none;
    background: rgba(176,129,63,0.12);
    color: var(--dorado-oscuro);
    border-radius: 999px;
    padding: 6px 12px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .item-btn:hover { background: rgba(176,129,63,0.25); }
</style>
</head>
<body>
<div class="bg-gradient" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>
<div class="particles" id="particles" aria-hidden="true"></div>
<img src="/images/lavender_dorado.png" class="lavender lavender-tl" alt="" aria-hidden="true" />
<img src="/images/lavender_dorado.png" class="lavender lavender-br" alt="" aria-hidden="true" />

<div class="card">
  <p class="icon">📷</p>
  <h1>Compartí el momento</h1>
  <p class="eyebrow">Lucía &amp; Agustín · 21.11.2026</p>
  <p class="desc">Sacá fotos y videos o elegí varios de tu galería. Se suben solos, de a poco, aunque el wifi esté lento. Podés seguir disfrutando de la fiesta.</p>

  <div class="field">
    <span class="field-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </span>
    <input type="text" id="guestName" placeholder="Tu nombre" maxlength="60" autocomplete="name" />
  </div>
  <p class="hint" id="nameHint"></p>

  <div class="actions">
    <button type="button" class="action-btn primary" data-pick="gallery"><span class="emoji">🖼️</span> Elegir de la galería</button>
    <button type="button" class="action-btn" data-pick="photo"><span class="emoji">📸</span> Sacar foto</button>
    <button type="button" class="action-btn" data-pick="video"><span class="emoji">🎥</span> Grabar video</button>
  </div>
  <input type="file" class="file-input" id="pickGallery" accept="image/*,video/*" multiple />
  <input type="file" class="file-input" id="pickPhoto" accept="image/*" capture="environment" />
  <input type="file" class="file-input" id="pickVideo" accept="video/*" capture="environment" />

  <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="Arrastrar fotos o videos">
    <p class="drop-text">O arrastrá tus fotos y videos acá<span>podés soltar varios a la vez</span></p>
  </div>

  <div class="summary" id="summary" aria-live="polite">
    <div class="summary-top"><strong id="summaryText"></strong><span id="summaryPct"></span></div>
    <div class="bar"><div id="summaryBar"></div></div>
    <p class="summary-note" id="summaryNote"></p>
  </div>

  <ul class="queue" id="queue"></ul>
</div>

<script>
  // ── Configuración ──
  // En local (yarn start) usa la API de `php artisan serve`; publicado, la real.
  var API_BASE_URL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    ? 'http://localhost:8000'
    : 'https://luyaguscasamiento.duckdns.org';
  var CHUNK_SIZE = 5 * 1024 * 1024;        // 5MB por pedazo (igual que el backend)
  var MAX_FILE_BYTES = 1.5 * 1024 * 1024 * 1024;
  var PARALLEL_FILES = 2;                  // archivos subiéndose a la vez
  var MAX_CHUNK_ATTEMPTS = 8;              // reintentos por pedazo antes de pausar
  var THUMB_SIZE = 480;
  var NAME_KEY = 'boda_guest_name';
  // ───────────────────

  // ── Partículas flotantes de fondo ──
  (function initParticles() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var container = document.getElementById('particles');
    var colors = [
      'radial-gradient(circle, rgba(176,129,63,0.55), rgba(199,160,99,0.12))',
      'radial-gradient(circle, rgba(124,144,114,0.5), rgba(176,129,63,0.1))',
      'radial-gradient(circle, rgba(246,241,231,0.6), rgba(199,160,99,0.25))',
    ];
    var count = window.innerWidth < 640 ? 16 : 24;
    for (var i = 0; i < count; i++) {
      var el = document.createElement('div');
      var size = 3 + Math.round(Math.random() * 8);
      el.className = 'particle';
      el.style.left = (Math.random() * 100) + '%';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.borderRadius = Math.random() < 0.3 ? '2px' : '50%';
      el.style.background = colors[i % colors.length];
      el.style.setProperty('--drift', Math.round((Math.random() - 0.5) * 90) + 'px');
      el.style.animationDuration = (11 + Math.random() * 13) + 's';
      el.style.animationDelay = (Math.random() * 8) + 's';
      container.appendChild(el);
    }
  })();

  var $ = function (id) { return document.getElementById(id); };
  var guestNameInput = $('guestName');
  var nameHint = $('nameHint');
  var queueEl = $('queue');
  var inputs = { gallery: $('pickGallery'), photo: $('pickPhoto'), video: $('pickVideo') };

  var queue = [];        // { id, file, guest, status, nextChunk, sentBytes, attempts, el, error }
  var active = 0;
  var nameWarned = false;
  var wakeLock = null;

  // ── Nombre del invitado (se recuerda para la próxima) ──
  try { guestNameInput.value = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
  guestNameInput.addEventListener('input', function () {
    try { localStorage.setItem(NAME_KEY, guestNameInput.value.trim()); } catch (e) {}
    if (guestNameInput.value.trim()) setHint('');
  });

  function setHint(msg, warn) {
    nameHint.textContent = msg;
    nameHint.className = 'hint' + (warn ? ' warn' : '');
  }

  // ── Elegir archivos ──
  document.querySelectorAll('[data-pick]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      // Pedimos el nombre una vez (así las fotos quedan ordenadas por
      // invitado), pero si insiste lo dejamos subir sin nombre.
      if (!guestNameInput.value.trim() && !nameWarned) {
        nameWarned = true;
        setHint('Escribí tu nombre así los novios saben quién la sacó (o tocá de nuevo para seguir sin nombre).', true);
        guestNameInput.focus();
        return;
      }
      inputs[btn.getAttribute('data-pick')].click();
    });
  });
  Object.keys(inputs).forEach(function (k) {
    inputs[k].addEventListener('change', function () {
      addFiles(inputs[k].files);
      inputs[k].value = '';
    });
  });

  var dropZone = $('dropZone');
  ['dragenter', 'dragover'].forEach(function (evt) {
    dropZone.addEventListener(evt, function (e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
  });
  ['dragleave', 'dragend'].forEach(function (evt) {
    dropZone.addEventListener(evt, function () { dropZone.classList.remove('drag-over'); });
  });
  dropZone.addEventListener('drop', function (e) {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });
  dropZone.addEventListener('click', function () { inputs.gallery.click(); });

  function isVideo(file) {
    return /^video\//.test(file.type) || /\.(mp4|mov|m4v|webm|mkv|3gp|avi)$/i.test(file.name);
  }

  function formatSize(bytes) {
    var mb = bytes / 1048576;
    return mb >= 1 ? (Math.round(mb * 10) / 10) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB';
  }

  function makeUploadId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'up_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  }

  function addFiles(fileList) {
    var guest = guestNameInput.value.trim();
    Array.prototype.forEach.call(fileList, function (file) {
      var item = {
        id: makeUploadId(),
        file: file,
        guest: guest,
        status: 'waiting',
        nextChunk: 0,
        sentBytes: 0,
        error: '',
        thumbBlob: null,
      };
      if (!/^(image|video)\//.test(file.type) && !/\.(jpe?g|png|gif|webp|heic|heif|bmp|mp4|mov|m4v|webm|mkv|3gp|avi)$/i.test(file.name)) {
        item.status = 'error';
        item.error = 'Solo se pueden subir fotos y videos';
        item.fatal = true;
      } else if (file.size > MAX_FILE_BYTES) {
        item.status = 'error';
        item.error = 'Muy pesado (máx. 1,5 GB). Probá con un video más corto.';
        item.fatal = true;
      }
      queue.push(item);
      renderItem(item, true);
    });
    renderSummary();
    pump();
  }

  // ── Cola: siempre hay hasta PARALLEL_FILES archivos subiendo ──
  function pump() {
    if (!navigator.onLine) { renderSummary(); return; }
    while (active < PARALLEL_FILES) {
      var next = queue.find(function (it) { return it.status === 'waiting'; });
      if (!next) break;
      startItem(next);
    }
    updateWakeLock();
    renderSummary();
  }

  function startItem(item) {
    active++;
    item.status = 'uploading';
    item.error = '';
    renderItem(item);

    uploadItem(item)
      .then(function () {
        item.status = 'done';
        item.sentBytes = item.file.size;
      })
      .catch(function (err) {
        item.status = 'error';
        item.fatal = !!(err && err.fatal);
        item.error = (err && err.userMessage) || (item.fatal
          ? 'No se pudo subir este archivo.'
          : 'Se cortó la conexión. Tocá "Reintentar".');
      })
      .then(function () {
        active--;
        renderItem(item);
        pump();
      });
  }

  function uploadItem(item) {
    var file = item.file;
    var totalChunks = Math.max(1, Math.ceil(file.size / CHUNK_SIZE));

    // La miniatura se genera mientras sube (no frena la subida).
    var thumbPromise = makeThumb(file).then(function (blob) {
      item.thumbBlob = blob;
      if (blob && !item.el.querySelector('.thumb img')) {
        item.el.querySelector('.thumb').innerHTML = '<img alt="" src="' + URL.createObjectURL(blob) + '" />';
      }
      return blob;
    }).catch(function () { return null; });

    function sendNext() {
      if (item.nextChunk >= totalChunks) return Promise.resolve();
      var index = item.nextChunk;
      var start = index * CHUNK_SIZE;
      var blob = file.slice(start, Math.min(start + CHUNK_SIZE, file.size));

      return sendChunk(item, index, totalChunks, blob, 1).then(function () {
        item.nextChunk = index + 1;
        item.sentBytes = Math.min(item.nextChunk * CHUNK_SIZE, file.size);
        renderItem(item);
        renderSummary();
        return sendNext();
      });
    }

    return sendNext().then(function () {
      return thumbPromise.then(function (blob) { if (blob) return sendThumb(item.id, blob); });
    });
  }

  function sendChunk(item, chunkIndex, totalChunks, blob, attempt) {
    var form = new FormData();
    form.append('upload_id', item.id);
    form.append('chunk_index', chunkIndex);
    form.append('total_chunks', totalChunks);
    form.append('original_filename', item.file.name || ('archivo-' + Date.now()));
    form.append('mime_type', item.file.type || '');
    form.append('guest_name', item.guest);
    form.append('chunk', blob, 'blob');

    return fetch(API_BASE_URL + '/api/media/chunk', {
      method: 'POST',
      body: form,
      headers: { Accept: 'application/json' },
    }).then(function (res) {
      if (res.ok) return res.json();
      return res.json().catch(function () { return {}; }).then(function (body) {
        var err = new Error('http_' + res.status);
        err.status = res.status;
        err.userMessage = body.error || (body.message && res.status === 422 ? body.message : '');
        err.retryAfter = body.retry_after || Number(res.headers.get('Retry-After')) || 0;
        // 4xx (salvo 408/429) = el archivo no sirve, reintentar no ayuda.
        err.fatal = res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429;
        throw err;
      });
    }).catch(function (err) {
      if (err.fatal || attempt >= MAX_CHUNK_ATTEMPTS) throw err;

      // Espera creciente: 1s, 2s, 4s… (o lo que pida el servidor).
      var wait = err.retryAfter ? err.retryAfter * 1000 : Math.min(30000, 1000 * Math.pow(2, attempt - 1));
      if (err.status === 507) {
        item.error = err.userMessage;
        item.waitingSpace = true;
        renderItem(item);
      }
      return waitFor(wait).then(function () {
        item.waitingSpace = false;
        return sendChunk(item, chunkIndex, totalChunks, blob, attempt + 1);
      });
    });
  }

  function waitFor(ms) {
    return new Promise(function (resolve) {
      var done = false;
      var finish = function () {
        if (done) return;
        done = true;
        window.removeEventListener('online', finish);
        resolve();
      };
      setTimeout(finish, ms);
      // Si vuelve la conexión, reintentamos enseguida.
      window.addEventListener('online', finish);
    });
  }

  function sendThumb(uploadId, blob) {
    var form = new FormData();
    form.append('upload_id', uploadId);
    form.append('thumb', blob, 'thumb.jpg');
    return fetch(API_BASE_URL + '/api/media/thumb', {
      method: 'POST', body: form, headers: { Accept: 'application/json' },
    }).catch(function () { /* la miniatura es opcional */ });
  }

  // ── Miniaturas (JPEG chico) para que el panel cargue rápido ──
  function makeThumb(file) {
    if (isVideo(file)) return videoThumb(file);
    if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i.test(file.name)) return Promise.resolve(null);
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        drawThumb(img, img.naturalWidth, img.naturalHeight).then(resolve);
        URL.revokeObjectURL(url);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  function videoThumb(file) {
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file);
      var video = document.createElement('video');
      var finished = false;
      var finish = function (val) {
        if (finished) return;
        finished = true;
        URL.revokeObjectURL(url);
        resolve(val);
      };
      video.muted = true;
      video.playsInline = true;
      video.preload = 'metadata';
      video.onloadeddata = function () {
        video.currentTime = Math.min(0.5, (video.duration || 1) / 2);
      };
      video.onseeked = function () {
        drawThumb(video, video.videoWidth, video.videoHeight).then(finish);
      };
      video.onerror = function () { finish(null); };
      setTimeout(function () { finish(null); }, 8000);
      video.src = url;
    });
  }

  function drawThumb(source, w, h) {
    return new Promise(function (resolve) {
      if (!w || !h) return resolve(null);
      var scale = Math.min(1, THUMB_SIZE / Math.max(w, h));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      try {
        canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (b) { resolve(b); }, 'image/jpeg', 0.75);
      } catch (e) { resolve(null); }
    });
  }

  // ── Render ──
  function renderItem(item, isNew) {
    if (isNew) {
      var li = document.createElement('li');
      li.className = 'item';
      li.innerHTML =
        '<div class="thumb">' + (isVideo(item.file) ? '🎥' : '🖼️') + '</div>' +
        '<div class="item-info"><p class="item-name"></p><p class="item-status"></p><div class="bar"><div></div></div></div>';
      li.querySelector('.item-name').textContent = item.file.name || 'archivo';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item-btn hidden';
      btn.addEventListener('click', function () { onItemButton(item); });
      li.appendChild(btn);
      item.el = li;
      queueEl.insertBefore(li, queueEl.firstChild);
    }

    var el = item.el;
    var pct = item.file.size ? Math.round((item.sentBytes / item.file.size) * 100) : 0;
    var statusText = {
      waiting: 'En espera · ' + formatSize(item.file.size),
      uploading: item.waitingSpace ? (item.error || 'Esperando lugar en el servidor…') : 'Subiendo… ' + pct + '%',
      done: '✓ Subido · ' + formatSize(item.file.size),
      error: item.error,
    }[item.status];

    el.className = 'item ' + item.status;
    el.querySelector('.item-status').textContent = statusText;
    el.querySelector('.bar > div').style.width = (item.status === 'done' ? 100 : pct) + '%';

    var btn = el.querySelector('.item-btn');
    if (item.status === 'error') {
      btn.textContent = item.fatal ? 'Quitar' : 'Reintentar';
      btn.classList.remove('hidden');
    } else if (item.status === 'waiting') {
      btn.textContent = 'Quitar';
      btn.classList.remove('hidden');
    } else {
      btn.classList.add('hidden');
    }
  }

  function onItemButton(item) {
    if (item.status === 'error' && !item.fatal) {
      item.status = 'waiting';
      renderItem(item);
      pump();
      return;
    }
    if (item.status === 'error' || item.status === 'waiting') {
      queue.splice(queue.indexOf(item), 1);
      item.el.remove();
      renderSummary();
    }
  }

  function renderSummary() {
    var summary = $('summary');
    var relevant = queue.filter(function (it) { return !it.fatal; });
    if (!relevant.length) { summary.classList.remove('visible'); return; }

    var total = 0, sent = 0, done = 0, failed = 0, pending = 0;
    relevant.forEach(function (it) {
      total += it.file.size;
      sent += it.status === 'done' ? it.file.size : it.sentBytes;
      if (it.status === 'done') done++;
      else if (it.status === 'error') failed++;
      else pending++;
    });
    var pct = total ? Math.round((sent / total) * 100) : 0;

    summary.classList.add('visible');
    summary.classList.toggle('done', pending === 0 && failed === 0);
    $('summaryBar').style.width = pct + '%';
    $('summaryPct').textContent = pct + '%';

    if (pending === 0 && failed === 0) {
      $('summaryText').textContent = '💛 ¡Listo! ' + done + (done === 1 ? ' archivo subido' : ' archivos subidos');
      $('summaryNote').textContent = 'Ya están con los novios. Podés seguir sacando y subiendo cuando quieras.';
    } else {
      $('summaryText').textContent = 'Subidos ' + done + ' de ' + relevant.length;
      $('summaryNote').textContent = !navigator.onLine
        ? '📶 Sin conexión. Seguimos solos apenas vuelva la señal.'
        : failed && !pending
          ? 'Algunos no se pudieron subir. Tocá "Reintentar".'
          : 'No cierres esta página hasta que termine. Podés bloquear la pantalla un ratito, pero si tarda mucho volvé a abrirla.';
    }
  }

  // ── Mantener la pantalla prendida mientras sube (si el celu lo permite) ──
  function updateWakeLock() {
    var busy = active > 0;
    if (busy && !wakeLock && navigator.wakeLock) {
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLock = lock;
        lock.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () {});
    } else if (!busy && wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') updateWakeLock();
  });

  window.addEventListener('online', function () {
    // Lo que quedó con error de red vuelve a la cola solo.
    queue.forEach(function (it) {
      if (it.status === 'error' && !it.fatal) { it.status = 'waiting'; renderItem(it); }
    });
    pump();
  });
  window.addEventListener('offline', renderSummary);

  window.addEventListener('beforeunload', function (e) {
    var pending = queue.some(function (it) { return it.status === 'waiting' || it.status === 'uploading'; });
    if (pending) { e.preventDefault(); e.returnValue = ''; }
  });
</script>

</body>
